name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (lint, format, types), build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Lint, format and type check (uncheck)
        run: bun run lint:check
      - run: bun run build
      - run: bun run lint:package

      - name: Generated code is up to date with spec/openapi.json
        working-directory: packages/effect-logto
        run: |
          bun run generate
          git diff --exit-code -- src || (echo "::error::Generated sources are stale. Run 'bun run generate' and commit the result." && exit 1)

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - name: Test with coverage
        working-directory: packages/effect-logto
        run: node --run test:coverage

  smoke:
    name: Packed package with effect@${{ matrix.effect }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest Effect the peer range admits, and whatever is newest.
        effect: [4.0.0, latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install the packed tarball into a clean project and run it under Node
        working-directory: packages/effect-logto
        run: bun run smoke --effect ${{ matrix.effect }}
